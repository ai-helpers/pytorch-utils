[project]
name = "ai-helpers-pytorch-utils"
version = "0.1.0a1"
description = "Common PyTorch utils"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Corentin Vasseur", email = "vasseur.corentin@gmail.com" }]
readme = "README.md"
keywords = ["machine-learning", "pytorch", "utils"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pytorch-lightning>=2.1.3,<3.0.0",
    "scikit-learn==1.3.2",
    "pandas==2.0.3",
    "numpy==1.26.4",
    "plotly>=5.14.1,<6.0.0",
    "torchinfo>=1.8.0,<2.0.0",
    "torch==2.2.2",
    "mlflow>=2.13.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/ai-helpers/pytorch-utils"
Documentation = "https://ai-helpers.github.io/pytorch-utils/"

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "coverage>=7.4.3,<8.0.0",
    "mypy>=1.9.0,<2.0.0",
    "ruff>=0.3.3,<0.4.0",
    "setuptools>=70.0.0,<71.0.0",
    "types-setuptools>=70.0.0.20240524,<71.0.0",
    "bandit>=1.7.8,<2.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "hypothesis>=6.103.0,<7.0.0",
]
documenters = [
    "sphinx>=7.2.6,<8.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
]
publishers = [
    "twine>=5.0.0,<6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytorch_utils"]

# CONFIGURATIONS

[tool.bandit]
targets = ["src"]
skips = ["B101", "B601", "B108"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = false

[tool.coverage.run]
branch = true
source = ["pytorch_utils"]
omit = ["__init__.py"]

[tool.mypy]
pretty = true
strict = true
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy", "numpy.typing.mypy_plugin"]

[tool.pytest.ini_options]
addopts = "--verbosity=2"
pythonpath = ["pytorch_utils"]

[tool.ruff]
fix = true
indent-width = 4
line-length = 100
target-version = "py310"
exclude = ["notebooks/"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D103"]