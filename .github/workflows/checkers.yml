name: Checkers - Quality

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: read
  id-token: write

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Install
        run: uv sync --locked
      - name: Checkers
        run: make checkers